<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Rahul Vashistha</title>
<style>
:root{--canvas:#E9EDF1;--panel:#fff;--line:#D3DAE2;--ink:#16212C;--ink-2:#4A5868;--ink-3:#6F7C8B;--accent:#13618A;--accent-ink:#fff;color-scheme:light;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--canvas:#10151B;--panel:#18202A;--line:#2C3946;--ink:#E7ECF1;--ink-2:#AEB9C5;--ink-3:#83909E;--accent:#4BA3D1;--accent-ink:#0C141B;color-scheme:dark}}
*{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);display:grid;place-items:center;padding:20px}
.v{background:var(--panel);border:1px solid var(--line);width:min(560px,100%)}
.top{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;gap:8px}
.top span{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:12.5px}
.body{padding:40px 28px;text-align:center}
.body svg{width:120px;height:auto;margin:0 auto 18px;display:block}
h1{font-size:26px;margin:0 0 8px;letter-spacing:-.01em}
p{color:var(--ink-2);margin:0 0 22px}
a{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:10px 16px}
</style>
</head>
<body>
<div class="v" role="main">
  <div class="top">Page not found<span>Error 404</span></div>
  <div class="body">
    <svg viewBox="0 0 120 80" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink-3)"><path d="M10 70h100M20 70V50M40 70V36M60 70V56M80 70V28M100 70V44" stroke-dasharray="4 4"/></svg>
    <h1>This visual has no data</h1>
    <p>The page you asked for doesn’t exist or has moved. The rest of the report is fine.</p>
    <a href="/">Go to the portfolio</a>
  </div>
</div>
</body>
</html>

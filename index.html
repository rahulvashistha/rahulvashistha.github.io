<script>
/* Apply the saved theme before anything paints, and record data-file errors. */
(function(){
  var t = null; try { t = localStorage.getItem("rv-theme"); } catch (e) {}
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "classic";
  document.documentElement.setAttribute("data-theme", t);
  window.SITE = {}; window.__dataErrors = [];
  window.addEventListener("error", function(e){
    var src = e.filename || (e.target && e.target.src) || "";
    if (/\/data\//.test(src)) window.__dataErrors.push(src.split("/").pop() + (e.lineno ? " (line " + e.lineno + ")" : ""));
  }, true);
})();
</script>
